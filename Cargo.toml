[package]
name = "fast-lane"
version = "0.1.0"
edition = "2024"

[dependencies]
# 异步运行时
tokio = { version = "1.35", features = ["full"] }

# HTTP 代理服务器
hyper = { version = "1.10.1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# HTTP 客户端（用于测速）
reqwest = { version = "0.13.4", features = ["json", "stream"] }

# 并发缓存
dashmap = "6.2.1"

# 时间处理
chrono = "0.4"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# 命令行参数解析（GUI 之前先用命令行）
clap = { version = "4.4", features = ["derive"] }

# 配置文件（TOML格式）
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2+spec-1.1.0"

# 错误处理
anyhow = "1.0"
thiserror = "2.0.18"

# 系统托盘和 GUI
tauri = { version = "2.11.2", features = ["custom-protocol", "tray-icon", "devtools", "rustls-tls"] }
