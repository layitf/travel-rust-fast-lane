[package]
name = "fast-lane"
version = "0.1.0"
edition = "2021"

[dependencies]
# 异步运行时
tokio = { version = "1.35", features = ["full"] }

# Web 框架（使用 0.7 稳定版本）
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }

# HTTP 客户端（用于测速）
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls"] }

# DNS 解析（trust-dns-proto 更新为 hickory-proto）
hickory-proto = "0.24"
hickory-resolver = "0.24"

# 并发缓存
dashmap = "6.2.1"

# 时间处理
chrono = "0.4"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# 命令行
clap = { version = "4.4", features = ["derive"] }

# 配置
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"

# 错误处理
anyhow = "1.0"
thiserror = "2.0.18"

# 系统目录
dirs = "6.0"

# HTTP 类型
http = "1.1"
http-body-util = "0.1"
bytes = "1.5"